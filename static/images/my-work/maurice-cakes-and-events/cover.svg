<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" role="img" aria-labelledby="title desc">
  <title id="title">Maurice Cakes and Events platform</title>
  <desc id="desc">Branded cover representing the ecommerce and business management platform.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#35131d"/>
      <stop offset="1" stop-color="#8d294b"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1024" height="576" fill="url(#background)"/>
  <circle cx="850" cy="70" r="220" fill="#f7b8ce" opacity=".12"/>
  <circle cx="80" cy="560" r="210" fill="#f6cf77" opacity=".1"/>
  <g fill="#fff">
    <text x="72" y="110" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">ECOMMERCE + ERP</text>
    <text x="72" y="190" font-family="Arial, sans-serif" font-size="54" font-weight="800">Maurice Cakes</text>
    <text x="72" y="252" font-family="Arial, sans-serif" font-size="54" font-weight="800">&amp; Events</text>
    <text x="72" y="306" font-family="Arial, sans-serif" font-size="23" opacity=".78">One platform for customers, orders and operations.</text>
  </g>
  <g transform="translate(590 150)" filter="url(#shadow)">
    <rect width="360" height="270" rx="24" fill="#fff"/>
    <rect x="24" y="24" width="150" height="18" rx="9" fill="#8d294b"/>
    <rect x="24" y="68" width="96" height="82" rx="14" fill="#f7dbe5"/>
    <rect x="132" y="68" width="96" height="82" rx="14" fill="#f3e3bd"/>
    <rect x="240" y="68" width="96" height="82" rx="14" fill="#ead6dd"/>
    <rect x="24" y="178" width="210" height="16" rx="8" fill="#d7cad0"/>
    <rect x="24" y="208" width="150" height="12" rx="6" fill="#e8dfe2"/>
    <rect x="252" y="184" width="84" height="44" rx="12" fill="#8d294b"/>
  </g>
</svg>
